name: Build reader

on:
  push:
    branches: ['**']
    paths:
      - 'reader/**'
      - '.github/workflows/build-reader.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build the reader
        run: pyinstaller --onefile --windowed --name EQLootReader --paths reader reader/app.py
      - name: Zip it
        run: Compress-Archive -Path dist/EQLootReader.exe -DestinationPath EQLootReader.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EQLootReader
          path: EQLootReader.zip
      - name: Publish a Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" EQLootReader.zip --title "EQ Loot Reader $env:GITHUB_REF_NAME" --generate-notes
